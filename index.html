
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hibatallah El Hamidy - Digital Card</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="card">

    <!-- NFC -->
    <div class="nfc">
        <svg viewBox="0 0 60 60" width="55">
            <path d="M12 22 Q28 30 12 38" />
            <path d="M25 14 Q48 30 25 46" />
            <path d="M39 7 Q65 30 39 53" />
        </svg>
        <span>NFC</span>
    </div>

    <!-- Photo et nom -->
    <header class="profile">
        <img src="profil.jpeg" alt="Photo de Hibatallah" class="profile-img">
        <h1>Hibatallah El Hamidy</h1>
    </header>

    <!-- Actions -->
    <section class="actions">

        <button onclick="saveContact()">
            <svg viewBox="0 0 48 48">
                <circle cx="19" cy="13" r="8"/>
                <path d="M4 39 Q4 25 19 25 Q30 25 33 32"/>
                <path d="M35 24 V42 M27 33 H45"/>
            </svg>
            <span>Enregistrer<br>le contact</span>
        </button>

        <button onclick="shareCard()">
            <svg viewBox="0 0 48 48">
                <circle cx="12" cy="24" r="5"/>
                <circle cx="36" cy="10" r="5"/>
                <circle cx="36" cy="38" r="5"/>
                <path d="M17 21 L31 12 M17 27 L31 36"/>
            </svg>
            <span>Partager</span>
        </button>

        <button onclick="showQR()">
            <svg viewBox="0 0 48 48">
                <path d="M5 18 V5 H18 M30 5 H43 V18 M43 30 V43 H30 M18 43 H5 V30"/>
                <rect x="12" y="12" width="8" height="8"/>
                <rect x="28" y="12" width="8" height="8"/>
                <rect x="12" y="28" width="8" height="8"/>
                <rect x="28" y="28" width="8" height="8"/>
            </svg>
            <span>QR Code</span>
        </button>

    </section>

    <!-- QR -->
    <div id="qr-container" class="qr-container">
        <div id="qrcode"></div>
        <button onclick="closeQR()">Fermer</button>
    </div>

    <!-- Informations -->
    <section class="information">

        <a href="tel:+212 7 71 75 61 81" class="info">
            <span class="icon phone">
                <svg viewBox="0 0 48 48">
                    <path d="M13 5 L21 16 L16 22 Q22 32 32 32 L37 27 L45 35 L39 43 Q12 42 5 15 Z"/>
                </svg>
            </span>
            <span class="details">+212 7 71 75 61 81</span>
            <span class="arrow">›</span>
        </a>

        <a href="mailto:elhammidyhiba@gmail.com" class="info">
            <span class="icon gmail">
                <svg viewBox="0 0 48 48">
                    <path d="M5 37 V11 L24 26 L43 11 V37"
                          fill="none" stroke="#4285F4" stroke-width="6"
                          stroke-linejoin="round"/>
                    <path d="M5 11 L24 26 L43 11"
                          fill="none" stroke="#EA4335" stroke-width="6"
                          stroke-linejoin="round"/>
                    <path d="M5 37 V11" stroke="#34A853" stroke-width="6"/>
                    <path d="M43 37 V11" stroke="#FBBC04" stroke-width="6"/>
                </svg>
            </span>
            <span class="details">elhammidyhiba@gmail.com</span>
            <span class="arrow">›</span>
        </a>

        <a href="https://www.linkedin.com/in/hibatallah-el-hamidy-94344b3b3/"
           target="_blank" rel="noopener noreferrer" class="info">
            <span class="icon linkedin">
                <svg viewBox="0 0 48 48">
                    <rect width="48" height="48" rx="9" fill="#0A66C2"/>
                    <path d="M12 19 V36 M12 12 V13 M21 36 V19 M21 26 Q21 18 29 18 Q36 18 36 27 V36"
                          fill="none" stroke="white" stroke-width="4"
                          stroke-linecap="round"/>
                </svg>
            </span>
            <span class="details">LinkedIn</span>
            <span class="arrow">›</span>
        </a>

        <a href="https://www.instagram.com/hibatallahelhamidy/"
           target="_blank" rel="noopener noreferrer" class="info">
            <span class="icon instagram">
                <svg viewBox="0 0 48 48">
                    <defs>
                        <linearGradient id="insta" x1="0" y1="1" x2="1" y2="0">
                            <stop offset="0%" stop-color="#FFB800"/>
                            <stop offset="50%" stop-color="#E1306C"/>
                            <stop offset="100%" stop-color="#833AB4"/>
                        </linearGradient>
                    </defs>
                    <rect width="48" height="48" rx="12" fill="url(#insta)"/>
                    <rect x="10" y="10" width="28" height="28" rx="8"
                          fill="none" stroke="white" stroke-width="3"/>
                    <circle cx="24" cy="24" r="7" fill="none"
                            stroke="white" stroke-width="3"/>
                    <circle cx="33" cy="15" r="2" fill="white"/>
                </svg>
            </span>
            <span class="details">Instagram</span>
            <span class="arrow">›</span>
        </a>

    </section>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="script.js"></script>

</body>
</html>
